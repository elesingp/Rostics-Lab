<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Результаты АА-теста</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h1>Результаты АА-теста</h1>
    <div class="table-responsive">
        {{ table|safe }}
    </div>
    <form action="/refresh-metrics-aa" method="post">
        <button type="submit">Refresh</button>
    </form>
    {% if images %}
        <div class="row">
        {% for image_name in images %}
            <div class="col-md-10 col-sm-14 mb-4">
                <img src="{{ url_for('static', filename=image_name) }}" class="img-fluid img-thumbnail" alt="Visualization">
            </div>
        {% endfor %}
        </div>
    {% endif %}
    <div class="mt-3">
        <a href="/" class="btn btn-secondary">Вернуться к списку экспериментов</a>
    </div>
</div>
</body>
</html>
